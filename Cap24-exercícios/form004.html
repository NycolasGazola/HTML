<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required placeholder="Nome completo">
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="name@email.com">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(d\{2}\)\d{4,5}-\d{4}$" required placeholder="(xx)xxxxx-xxxx">
            </p>
        </fieldset>
        <fieldset>
            <legend>Dados Escolares</legend>
            <p>
                    <label for="inome">Escola</label>
                    <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required placeholder="Nome da Escola">
                </p>
                <p>
                    <label for="iemail">Período</label>
                    <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="---- à ----">
                </p>
                <p>
                    <label for="itel">Endereço</label>
                    <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(d\{2}\)\d{4,5}-\d{4}$" required placeholder="Rua vai com Deus, 333">
                </p>
        </fieldset>
        <!--ESTUDAR MAIS SOBRE REGEX-->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
