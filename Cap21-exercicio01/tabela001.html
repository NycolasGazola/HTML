<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }
        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;/*Alinhamento horizontal*/
            vertical-align: middle; /*Alinhamento vertical*/
        }
        .numero{
            text-align: right;
        }

    </style>
</head>
<body>
    <h1>Primeira Tabela</h1>
    <!--
            HIERARQUIA DE TABELAS (SIMPLES)
            TABLE = Tabela
                TABLE ROW = Linha de tabela
                    TABLE HEADER = Cabeçalho de tabela
                    TABLE DATA = Dados de tabela
        -->
    <table>
         <tr> <!--Primeira Linha-->
            <td>A1
            <td>B1
            <td>C1
        <tr> <!--Segunda Linha-->
            <td>A2
            <td>B2
            <td class="numero">C2
        <tr> <!--Terceira Linha-->
            <td>A3
            <td>B3
            <td class="numero">C3
        <tr> <!--Quarta Linha-->
            <td>A4
            <td>B4
            <td>C4
        <tr>
            <td>A5
            <td>B5
            <td>C5
        
    </table> 
</body>
</html>
