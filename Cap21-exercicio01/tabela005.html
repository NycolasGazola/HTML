<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        td, th{
            border: 1px solid black;
            padding: 8px;
        }
        col.cnome{
            background-color: lightgray;
        }
        col.csexo{
            background-color: lightblue;
        }
        col.cidade{
            background-color: lightcyan;
        }
        col.cprof{
            background-color: lightpink;
        }

    </style>
</head>
<body>
    <h1>Exercícios de Tabelas</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>Nycolas</td>
            <td>M</td>
            <td>29</td>
            <td>Motorista</td>
        </tr>
        <tr>
            <td>Natalia</td>
            <td>F</td>
            <td>29</td>
            <td>Do lar</td>
        </tr>
        <tr>
            <td>Fernanda</td>
            <td>F</td>
            <td>13</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Phietro</td>
            <td>M</td>
            <td>4</td>
            <td>Estudante</td>
        </tr>
    </table>
    
</body>
</html>
